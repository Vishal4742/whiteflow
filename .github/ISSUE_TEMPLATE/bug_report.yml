name: Bug report
description: Something in Whiteflow doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For a security problem, use the Security tab instead. Never paste a private key or a secret.
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, API route or package, for example /checkout, POST /api/v1/sessions or whiteflow-mcp.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: tx
    attributes:
      label: Transaction or checkout id (if any)
      description: A testnet transaction hash or checkout id helps us find it.
  - type: input
    id: env
    attributes:
      label: Browser and device
